<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NanoHRMS Homepage Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#f7f8fa}
a{color:#203247;text-decoration:none}a:hover{color:#40698f}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
.ease{transition:background-color 180ms cubic-bezier(.22,1,.36,1),color 180ms cubic-bezier(.22,1,.36,1),border-color 180ms cubic-bezier(.22,1,.36,1),box-shadow 180ms cubic-bezier(.22,1,.36,1),transform 180ms cubic-bezier(.22,1,.36,1)}
.lift:hover{box-shadow:0 8px 28px rgb(26 42 61 / .07);border-color:#cfd8e2}
.press:active{transform:scale(.98)}
.emp-row{display:grid;grid-template-columns:28px minmax(0,2.3fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
.emp-row:hover{background:#f4f7fa}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.mods{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px}
.modgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.app{display:grid;grid-template-columns:184px minmax(0,1fr) 260px}
.focus-ring:focus-visible{outline:2px solid #40698f;outline-offset:2px}
@media (max-width:1100px){.app{grid-template-columns:184px minmax(0,1fr)}.app-detail{display:none}.five{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.nav-links{display:none!important}.split,.three,.mods{grid-template-columns:minmax(0,1fr)}.app{grid-template-columns:minmax(0,1fr)}.app-side{display:none!important}.five{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-h{font-size:40px!important}}
.rise{animation:rise 560ms cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:70ms}.d2{animation-delay:140ms}.d3{animation-delay:210ms}.d4{animation-delay:300ms}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn 260ms cubic-bezier(.22,1,.36,1) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide-in{animation:slideIn 180ms cubic-bezier(.22,1,.36,1) both}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.grow-bar{animation:grow 800ms cubic-bezier(.22,1,.36,1) 120ms both;transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lift:hover{transform:translateY(-2px)}
.nav-links a{position:relative;padding:6px 0}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform 180ms cubic-bezier(.22,1,.36,1)}
.nav-links a:hover::after{transform:scaleX(1)}
.menu-btn{display:none}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-size:16px;font-weight:600;color:#203247}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{flex-shrink:0;transition:transform 180ms cubic-bezier(.22,1,.36,1)}
.faq details[open] summary svg{transform:rotate(45deg)}
.faq details[open] p{animation:fadeIn 260ms cubic-bezier(.22,1,.36,1) both}
.faq summary:focus-visible{outline:2px solid #40698f;outline-offset:4px;border-radius:4px}
@media (max-width:860px){.menu-btn{display:grid}.signin{display:none}}
@media (prefers-reduced-motion:reduce){.rise,.fade-in,.slide-in,.grow-bar,.faq details[open] p{animation:none!important}.lift:hover{transform:none}}
@media (max-width:560px){.emp-row{grid-template-columns:28px minmax(0,1fr) minmax(0,auto)}.hide-sm{display:none}.modgrid{grid-template-columns:minmax(0,1fr)}.five{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="tweak" role="group" aria-label="Accent colour">
<span>Accent</span>
<button type="button" data-a="#40698f" aria-label="Mist blue" style="background:#40698f"></button>
<button type="button" data-a="#856344" aria-label="Sand" style="background:#856344"></button>
<button type="button" data-a="#526f58" aria-label="Sage" style="background:#526f58"></button>
<button type="button" data-a="#596775" aria-label="Graphite" style="background:#596775"></button>
</div>
<style>
:root{color-scheme:light}
.tweak{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border:1px solid #e3e8ee;border-radius:12px;box-shadow:0 8px 28px rgb(26 42 61 / .12);font:600 12px Geist,ui-sans-serif,system-ui,sans-serif;color:#43556a}
.tweak button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c9d3de;cursor:pointer}
.tweak button[aria-pressed="true"]{box-shadow:0 0 0 2px #203247}
.tweak button:focus-visible{outline:2px solid #203247;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ease{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">


<div style="font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #43556a; background: #f7f8fa; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased">

<!-- NAV -->
<header style="{{headerStyle}}">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 32px">
<a href="#top" style="display: flex; align-items: center; gap: 10px; font-weight: 650; color: #203247; font-size: 16px; letter-spacing: -0.01em">
<span style="width: 28px; height: 28px; border-radius: 7px; background: {{accent}}; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700">N</span>
NanoHRMS
</a>
<nav class="nav-links" aria-label="Main" style="display: flex; gap: 24px; font-size: 14px; flex-grow: 1">
<a href="#product">Product</a>
<a href="#modules">Modules</a>
<a href="#deploy">Security &amp; deployment</a>
<a href="#pricing">Pricing</a>
<a href="#faq">FAQ</a>
</nav>
<div style="display: flex; gap: 8px; align-items: center; margin-left: auto">
<a href="#top" class="signin" style="font-size: 14px; padding: 10px 12px">Sign in</a>
<a href="#top" class="ease press" style="font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 8px; background: {{accent}}; color: #fff">Start free</a>
<button type="button" class="menu-btn ease focus-ring" aria-label="{{menuLabel}}" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}" style="width: 44px; height: 44px; place-items: center; border: 1px solid #e3e8ee; border-radius: 9px; background: #fff; color: #203247">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</div>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<nav data-key="mobile-menu" class="slide-in" aria-label="Mobile" style="border-top: 1px solid #e3e8ee; background: #fff; padding: 8px 24px 16px; display: flex; flex-direction: column; font-size: 16px">
<a href="#product" onClick="{{closeMenu}}" style="padding: 12px 0; border-bottom: 1px solid #edf0f4">Product</a>
<a href="#modules" onClick="{{closeMenu}}" style="padding: 12px 0; border-bottom: 1px solid #edf0f4">Modules</a>
<a href="#deploy" onClick="{{closeMenu}}" style="padding: 12px 0; border-bottom: 1px solid #edf0f4">Security &amp; deployment</a>
<a href="#pricing" onClick="{{closeMenu}}" style="padding: 12px 0; border-bottom: 1px solid #edf0f4">Pricing</a>
<a href="#faq" onClick="{{closeMenu}}" style="padding: 12px 0; border-bottom: 1px solid #edf0f4">FAQ</a>
<a href="#top" onClick="{{closeMenu}}" style="padding: 12px 0">Sign in</a>
</nav>
</sc-if>
</header>

<!-- HERO -->
<section id="top" style="max-width: 1200px; margin: 0 auto; padding: 88px 24px 0">
<div style="max-width: 900px">
<h1 class="hero-h rise" style="margin: 0; font-size: 64px; line-height: 1.02; letter-spacing: -0.04em; color: #203247; font-weight: 650; text-wrap: balance">Run people, pay and time off from one calm workspace.</h1>
<p class="rise d1" style="margin: 22px 0 0; font-size: 19px; line-height: 1.55; max-width: 620px; color: #43556a">NanoHRMS keeps employee records, leave, attendance, payroll and hiring in one place. Run it in our cloud, or on servers you control.</p>
<div class="rise d2" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; align-items: center">
<a href="#pricing" class="ease press" style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 9px; background: {{accent}}; color: #fff; font-weight: 600">Start free
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
<a href="#deploy" class="ease press" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 9px; border: 1px solid #c9d3de; background: #fff; color: #203247; font-weight: 600">Book a demo</a>
<span style="font-size: 13px; color: #5f6f82; margin-left: 4px">Free for up to 5 employees · 14-day trial on paid plans</span>
</div>
</div>

<!-- PRODUCT FRAME -->
<div id="product" class="rise d3" style="margin-top: 56px; position: relative">
<div aria-hidden="true" style="position: absolute; left: -24px; right: -24px; top: 38%; bottom: -36px; background: #fbf2e9; border-radius: 24px"></div>
<div style="position: relative; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px">
<div role="group" aria-label="Preview as" style="display: inline-flex; padding: 4px; background: #eef1f5; border-radius: 10px; gap: 4px">
<button type="button" class="ease focus-ring" aria-pressed="{{isAdmin}}" onClick="{{showAdmin}}" style="{{tabAdmin}}">HR admin view</button>
<button type="button" class="ease focus-ring" aria-pressed="{{isEmp}}" onClick="{{showEmp}}" style="{{tabEmp}}">Employee view</button>
</div>
<span style="font-size: 13px; color: #5f6f82">Try it: tick a few rows, click a name, or switch views.</span>
</div>

<div style="position: relative; background: #fff; border: 1px solid #e3e8ee; border-radius: 14px; box-shadow: 0 18px 65px rgb(21 36 53 / .10); overflow: hidden">
<!-- window bar -->
<div style="height: 40px; border-bottom: 1px solid #edf0f4; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #fbfcfd">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #dfe4ea"></span>
<span style="width: 10px; height: 10px; border-radius: 50%; background: #dfe4ea"></span>
<span style="width: 10px; height: 10px; border-radius: 50%; background: #dfe4ea"></span>
<span style="margin-left: 16px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #5f6f82">acme.[your-hrms-domain]</span>
</div>

<div class="app" style="min-height: 520px">
<!-- sidebar -->
<aside class="app-side" style="border-right: 1px solid #edf0f4; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; background: #fbfcfd">
<div style="font-weight: 650; color: #203247; padding: 4px 10px 14px">Acme Ltd</div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
<div style="{{n.style}}"><span style="{{n.bar}}"></span>{{n.label}}</div>
</sc-for>
</aside>

<!-- ADMIN VIEW -->
<sc-if value="{{isAdmin}}" hint-placeholder-val="{{ true }}">
<div data-key="admin" class="fade-in" style="padding: 20px 22px; min-width: 0">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="flex-grow: 1">
<div style="font-size: 18px; font-weight: 650; color: #203247; letter-spacing: -0.015em">Employees</div>
<div style="font-size: 12.5px; color: #5f6f82">248 people · Saved view: Everyone</div>
</div>
<label style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid #e3e8ee; border-radius: 8px; font-size: 13px; color: #5f6f82; min-width: 200px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span class="sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search employees</span>
<input type="text" placeholder="Search name, team, ID" style="border: 0; outline: 0; font: inherit; color: #203247; background: transparent; width: 100%">
</label>
<button type="button" class="ease press" style="height: 34px; padding: 0 14px; border-radius: 8px; border: 0; background: {{accent}}; color: #fff; font-size: 13px; font-weight: 600">Add employee</button>
</div>

<!-- toolbar / bulk bar -->
<div style="margin-top: 16px; min-height: 38px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<sc-if value="{{noSel}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 12.5px; padding: 6px 10px; border-radius: 999px; background: {{accentSoft}}; color: {{accent}}; font-weight: 600">Status: Any</span>
<span style="font-size: 12.5px; padding: 6px 10px; border-radius: 999px; border: 1px solid #e3e8ee">Department</span>
<span style="font-size: 12.5px; padding: 6px 10px; border-radius: 999px; border: 1px solid #e3e8ee">Location</span>
<span style="font-size: 12.5px; color: #5f6f82; margin-left: 4px">Tick a row to see bulk actions</span>
</sc-if>
<sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
<div data-key="bulk" class="slide-in" style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-radius: 10px; background: #203247; color: #fff; font-size: 13px">
<span style="font-weight: 600">{{selCount}} selected</span>
<span style="width: 1px; height: 18px; background: rgb(255 255 255 / .2)"></span>
<button type="button" style="border: 0; background: transparent; color: #fff; padding: 6px 8px; font-size: 13px">Message</button>
<button type="button" style="border: 0; background: transparent; color: #fff; padding: 6px 8px; font-size: 13px">Export</button>
<button type="button" style="border: 0; background: transparent; color: #fff; padding: 6px 8px; font-size: 13px">Change manager</button>
<button type="button" onClick="{{clearSel}}" style="border: 0; background: rgb(255 255 255 / .12); color: #fff; padding: 6px 10px; border-radius: 7px; font-size: 13px">Clear</button>
</div>
</sc-if>
</div>

<!-- table -->
<div style="margin-top: 10px; border: 1px solid #edf0f4; border-radius: 10px; overflow: hidden">
<div class="emp-row" style="padding: 9px 14px; background: #fbfcfd; font-size: 11.5px; color: #5f6f82; font-weight: 600; letter-spacing: .02em">
<span></span><span>Name</span><span class="hide-sm">Department</span><span>Status</span><span class="hide-sm">Joined</span>
</div>
<sc-for list="{{emps}}" as="e" hint-placeholder-count="7">
<div class="emp-row ease" style="{{e.rowStyle}}">
<input type="checkbox" checked="{{e.checked}}" onChange="{{e.toggle}}" aria-label="Select {{e.name}}" style="width: 15px; height: 15px; accent-color: {{accent}}">
<button type="button" class="focus-ring" onClick="{{e.focusMe}}" style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 0; text-align: left; min-width: 0">
<span style="{{e.avatar}}">{{e.initials}}</span>
<span style="min-width: 0">
<span style="display: block; color: #203247; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.name}}</span>
<span style="display: block; color: #5f6f82; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.role}}</span>
</span>
</button>
<span class="hide-sm" style="font-size: 13px">{{e.dept}}</span>
<span><span style="{{e.pill}}">{{e.status}}</span></span>
<span class="hide-sm" style="font-size: 13px; font-family: 'Geist Mono', ui-monospace, monospace; color: #5f6f82">{{e.joined}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>

<!-- EMPLOYEE VIEW -->
<sc-if value="{{isEmp}}" hint-placeholder-val="{{ false }}">
<div data-key="emp" class="fade-in" style="padding: 28px 30px; min-width: 0">
<div style="font-size: 13px; color: #5f6f82">Friday, 2 October</div>
<div style="font-size: 26px; font-weight: 650; color: #203247; letter-spacing: -0.025em; margin-top: 2px">Good morning, Rahul</div>
<div class="three" style="margin-top: 22px">
<div style="border: 1px solid #edf0f4; border-radius: 12px; padding: 18px">
<div style="font-size: 12.5px; color: #5f6f82">Annual leave left</div>
<div style="font-size: 30px; font-weight: 650; color: #203247; letter-spacing: -0.03em; margin-top: 4px; font-variant-numeric: tabular-nums">12 <span style="font-size: 14px; font-weight: 500; color: #5f6f82">of 18 days</span></div>
<div style="height: 6px; border-radius: 99px; background: #eef1f5; margin-top: 12px; overflow: hidden"><div class="grow-bar" style="width: 66%; height: 100%; background: {{accent}}; border-radius: 99px"></div></div>
</div>
<div style="border: 1px solid #edf0f4; border-radius: 12px; padding: 18px">
<div style="font-size: 12.5px; color: #5f6f82">September payslip</div>
<div style="font-size: 15px; font-weight: 600; color: #203247; margin-top: 8px">Ready to download</div>
<button type="button" class="ease press" style="margin-top: 12px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #c9d3de; background: #fff; color: #203247; font-size: 13px; font-weight: 600">Download PDF</button>
</div>
<div style="border-radius: 12px; padding: 18px; background: #fbf2e9">
<div style="font-size: 12.5px; color: #886445">Next company holiday</div>
<div style="font-size: 15px; font-weight: 600; color: #203247; margin-top: 8px">Friday, 23 October</div>
<div style="font-size: 13px; color: #886445; margin-top: 4px">Three weeks from today</div>
</div>
</div>
<div style="margin-top: 16px; border: 1px solid #edf0f4; border-radius: 12px; padding: 18px">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="flex-grow: 1">
<div style="font-size: 14px; font-weight: 600; color: #203247">Time off · 26–27 October</div>
<div style="font-size: 12.5px; color: #5f6f82">2 days annual leave</div>
</div>
<span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #fff5e6; color: #8d601f">Waiting on HR</span>
</div>
<div style="display: flex; gap: 0; margin-top: 18px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<div style="height: 3px; background: {{accent}}; border-radius: 99px"></div>
<div style="font-size: 12px; color: #203247; font-weight: 600">Submitted</div>
<div style="font-size: 11.5px; color: #5f6f82">Mon 28 Sep</div>
</div>
<div style="width: 8px"></div>
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<div style="height: 3px; background: {{accent}}; border-radius: 99px"></div>
<div style="font-size: 12px; color: #203247; font-weight: 600">Manager approved</div>
<div style="font-size: 11.5px; color: #5f6f82">Tue 29 Sep · Divya Rao</div>
</div>
<div style="width: 8px"></div>
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<div style="height: 3px; background: #e3e8ee; border-radius: 99px"></div>
<div style="font-size: 12px; color: #203247; font-weight: 600">HR confirms</div>
<div style="font-size: 11.5px; color: #5f6f82">Usually within a day</div>
</div>
</div>
</div>
<button type="button" class="ease press" style="margin-top: 16px; height: 40px; padding: 0 16px; border-radius: 9px; border: 0; background: {{accent}}; color: #fff; font-size: 14px; font-weight: 600">Request time off</button>
</div>
</sc-if>

<!-- detail panel -->
<aside class="app-detail" style="border-left: 1px solid #edf0f4; padding: 20px; background: #fbfcfd">
<sc-if value="{{isAdmin}}" hint-placeholder-val="{{ true }}">
<div data-key="{{fe.id}}" class="fade-in" style="display: flex; flex-direction: column; gap: 14px">
<span style="{{fe.avatarLg}}">{{fe.initials}}</span>
<div>
<div style="font-size: 16px; font-weight: 650; color: #203247">{{fe.name}}</div>
<div style="font-size: 13px; color: #5f6f82">{{fe.role}}</div>
</div>
<div><span style="{{fe.pill}}">{{fe.status}}</span></div>
<div style="display: flex; flex-direction: column; gap: 10px; font-size: 13px; border-top: 1px solid #edf0f4; padding-top: 14px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="color: #5f6f82">Department</span><span style="color: #203247">{{fe.dept}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="color: #5f6f82">Manager</span><span style="color: #203247">{{fe.manager}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="color: #5f6f82">Location</span><span style="color: #203247">{{fe.loc}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="color: #5f6f82">Leave left</span><span style="color: #203247; font-variant-numeric: tabular-nums">{{fe.leave}}</span></div>
</div>

<script>

class Component extends DCLogic {
  constructor(props) {

  mix(hex, t) {

    var n = parseInt(h, 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;

      { id: 'e1', name: 'Aarav Mehta', role: 'Senior Engineer', dept: 'Engineering', status: 'Active', joined: '12 Mar 2022', manager: 'Divya Rao', loc: 'Bengaluru', leave: '9 days' },

      { id: 'e7', name: 'Arjun Das', role: 'Support Engineer', dept: 'Operations', status: 'Notice period', joined: '15 Jun 2022', manager: 'Karan Shah', loc: 'Pune', leave: '4 days' }
